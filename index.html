<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILENT-ROOM</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <main>
        <div class="subtitle">
            HAUNTED HOUSE • STAMP RALLY
        </div>
        <h1 id="title">お化け屋敷スタンプ帳</h1>
        <p>３つの文字を集めよう</p>
        <p class="hint" id="hint"></p>
        <div class="img">
            <!-- 枠1：tag=1のときに画像を出したい場所 -->
            <div id="area-1" class="image-box">1</div>

            <!-- 枠2：tag=2のときに画像を出したい場所 -->
            <div id="area-2" class="image-box">2</div>

            <!-- 枠3：tag=3のときに画像を出したい場所 -->
            <div id="area-3" class="image-box">3</div>
        </div>
        <!-- ↓これは見つけた時のメッセージが出る部分 -->
        <p class="message" id="message" aria-live="polite"></p>

        <!-- ここのボタンはあくまで動作確認 -->
        <div class="buttons" id="buttons"></div>
        <!-- ここまで -->
    </main>
    <script src="./index.js" defer></script>
    <!-- deferは、htmlの実行が終わる前にjsが実行するとエラーになるため、htmlが実行し終わってから実行するように -->
</body>

</html>
